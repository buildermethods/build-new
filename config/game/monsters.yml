# Charming, all-ages monsters that stand in for household tasks. `rooms` and
# `categories` drive the default monster for a task; `quest_title` is the
# default fantasy title shown above the plain-language task.
laundry_troll:
  name: Laundry Troll
  quest_title: Tame the Laundry Troll
  rooms: [laundry, utility]
  categories: [laundry]
dust_bunny_horde:
