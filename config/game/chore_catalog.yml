# Suggested chores offered in setup. Frequencies are sensible defaults and
# all editable. Edit by hand (quote any title containing a comma).
---
frequencies:
  daily:
    label: Daily
    kind: calendar
    weekdays:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
  every_2_days:
    label: Every 2 days
    kind: completion
    interval: 2
  every_3_days:
    label: Every 3 days
    kind: completion
    interval: 3
  twice_weekly:
    label: Twice a week
    kind: calendar
    weekdays:
    - 1
    - 4
  school_nights:
    label: School nights
    kind: calendar
    weekdays:
    - 0
    - 1
    - 2
    - 3
    - 4
  weekly:
    label: Weekly
    kind: completion
    interval: 7
  fortnightly:
    label: Every 2 weeks
    kind: completion
    interval: 14
  monthly:
    label: Monthly
    kind: completion
    interval: 30
  quarterly:
    label: Every 3 months
    kind: completion
    interval: 90
  twice_yearly:
    label: Twice a year
    kind: completion
    interval: 182
